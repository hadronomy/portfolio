name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      TURBO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.2'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}-
      - run: bun install --frozen-lockfile
      - run: bun run ci
      - name: Build the Vercel adapter without production credentials
        run: bun run build
        env:
          VERCEL: '1'
          VERCEL_ENV: preview
  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:${{ vars.POSTGRES_MAJOR || '17' }}
        env:
          POSTGRES_USER: restore
          POSTGRES_PASSWORD: scratch-only
          POSTGRES_DB: portfolio_restore_admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U restore -d portfolio_restore_admin"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      POSTGRES_MAJOR: ${{ vars.POSTGRES_MAJOR || '17' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.2'
      - run: bun install --frozen-lockfile
      - run: bash scripts/deploy/install-tools.sh
      - run: node scripts/deploy/restore.integration.mjs
        env:
          POSTGRES_TEST_URL: postgres://restore:scratch-only@127.0.0.1:5432/portfolio_restore_admin?sslmode=disable
