name: Restore drill
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: database-restore-drill
  cancel-in-progress: false
jobs:
  restore:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: restore-drill
    services:
      postgres:
        image: postgres:${{ vars.POSTGRES_MAJOR || '17' }}
        env:
          POSTGRES_USER: restore
          POSTGRES_PASSWORD: scratch-only
          POSTGRES_DB: portfolio_restore
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U restore -d portfolio_restore"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      POSTGRES_MAJOR: ${{ vars.POSTGRES_MAJOR || '17' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.2'
      - run: bun install --frozen-lockfile
      - run: bash scripts/deploy/install-tools.sh
      - name: Restore and compare the encrypted snapshot
        run: |
          umask 077
          identity="$RUNNER_TEMP/backup-age-identity"
          trap 'rm -f "$identity"' EXIT
          printf '%s\n' "$BACKUP_AGE_IDENTITY" > "$identity"
          unset BACKUP_AGE_IDENTITY
          AGE_IDENTITY_FILE="$identity" node scripts/deploy/restore-drill.mjs
        env:
          RESTORE_DATABASE_URL: postgres://restore:scratch-only@127.0.0.1:5432/portfolio_restore?sslmode=disable
          BACKUP_AGE_IDENTITY: ${{ secrets.BACKUP_AGE_IDENTITY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
